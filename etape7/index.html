<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>CRUD-Persons</title>

</head>

<body>
    <div id="table_container">
        <div id="form_container">
            <div class="form_group">
                <label class="form_label">Nom:</label>
                <input type="text" id="form_nom" class="form_field">
            </div>
            <div class="form_group">
                <label class="form_label">Prénom:</label>
                <input type="text" id="form_prenom" class="form_field">
            </div>
            <div class="form_group">
                <label class="form_label">Points:</label>
                <input type="number" id="form_points" class="form_field">
            </div>
            <button class="btn-add" onclick="doNewData()">Ajouter</button>
            <button class="btn-find" onclick="find()">rechercher</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <th class="col_checkbox">Select</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Totale point(s)= 0</p>
        </div>
        <div id="container_btn">
            <button class="btn-consol" onclick="consoleTableau()">Console Tableau</button>
            <button class="btn-del" onclick="deleteRow()">Supprimer</button>
            <select id="selectTri">
                <option value="" disabled selected>-- Choisir un tri --</option>
                <option value="nom">Trier par Nom (A-Z)</option>
                <option value="points-des">Trier par Points (des)</option>
                <option value="points-asd">Trier par Points (asd)</option>
            </select>
            <button id="tri" onclick="trier()">Trier</button>
        </div>
        <div class="filtrer">
        <button id="flt" onclick="filtrer()">filtrer</button>
            <select id="selectFiltre">
                <option value="" disabled selected>-- Choisir le filtre --</option>
                <option value="passants">filtrer les passants</option>
                <option value="redoublants">filtrer les redoublants</option>
            </select>
            <div class="form_group">
                <label class="form_label">Moyenne de passage:</label>
                <input type="number" id="form_moy" class="form_field">
            </div>
        </div>
    </div>
</body>
